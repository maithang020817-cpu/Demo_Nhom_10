{% extends "base.html" %}
{% block h1 %}💵 Thanh toán theo bàn{% endblock %}
{% block body %}
{% if not rows %}<div class="card">Không có bàn nào đang chờ thanh toán.</div>{% endif %}
{% for r in rows %}
<div class="card"><b>Bàn {{ r.table_no }}</b> · {{ r.n }} đơn · <b>{{ r.t|vnd }}</b>
<div class="row" style="margin-top:8px">
<a class="btn sm gray" href="/bill/{{ r.table_no }}" target="_blank">🧾 Xem / in hóa đơn</a>
<form method="post" action="/admin/pay/{{ r.table_no }}" onsubmit="return confirm('Xác nhận đã thu tiền?')"><button class="btn sm green">Đã thanh toán</button></form></div></div>
{% endfor %}
{% endblock %}
